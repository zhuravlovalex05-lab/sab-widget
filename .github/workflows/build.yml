name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip & Build
        run: |
          sudo apt-get update && sudo apt-get install -y aapt apksigner
          unzip -o "*.zip" -d extracted
          
          PROJ_DIR=$(dirname $(find extracted -name "AndroidManifest.xml" | head -n 1))
          cd "$PROJ_DIR"
          
          mkdir -p build/gen build/obj build/apk
          aapt package -f -m -J build/gen -M AndroidManifest.xml -S res -I /usr/local/lib/android/sdk/platforms/android-34/android.jar
          javac -cp /usr/local/lib/android/sdk/platforms/android-34/android.jar -d build/obj java/com/example/sabwidget/*.java || true
          /usr/local/lib/android/sdk/build-tools/34.0.0/d8 --output build/apk/classes.dex build/obj/com/example/sabwidget/*.class || true
          aapt package -f -M AndroidManifest.xml -S res -I /usr/local/lib/android/sdk/platforms/android-34/android.jar -F build/apk/app.unsigned.apk build/apk
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --out "$GITHUB_WORKSPACE/SabWidget.apk" build/apk/app.unsigned.apk

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: SabWidget-APK
          path: SabWidget.apk
